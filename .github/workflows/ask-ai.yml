name: Ask AI
on:
  workflow_dispatch:

permissions:
  models: read

jobs:
  ask-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch AI Response via curl
        id: ai-response
        run: |
          # Call the GitHub Marketplace Models API directly
          RESPONSE=$(curl -s -X POST "https://azure.com" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-4o-mini",
              "messages": [
                {"role": "user", "content": "Give me a programming joke."}
              ],
              "temperature": 0.7
            }')

          # Extract only the content string using jq, handling newlines cleanly
          JOKE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          
          # Use an environment file to safely pass multiline text between steps
          echo "JOKE_TEXT<<EOF" >> $GITHUB_ENV
          echo "$JOKE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Display AI Response
        run: |
          echo "## 🤖 AI Response" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$JOKE_TEXT" >> $GITHUB_STEP_SUMMARY
