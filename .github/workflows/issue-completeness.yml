name: Issue Completeness

on:
  issues:
    types: [opened]

permissions:
  models: read
  issues: write

jobs:
  analyze:
    name: AI Issue Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Analyze issue with AI
        id: ai-response
        run: |
          # Safe injection of issue text via env variables
          export ISSUE_USER="${{ github.event.issue.user.login }}"
          export ISSUE_TITLE="${{ github.event.issue.title }}"
          export ISSUE_BODY=$(cat << 'EOF'
          ${{ github.event.issue.body }}
          EOF
          )

          PROMPT_TEXT="New issue opened by $ISSUE_USER\nTitle: $ISSUE_TITLE\nBody:\n---\n$ISSUE_BODY\n---"
          SYSTEM_PROMPT="You are a GitHub issue assistant. Analyze issues for completeness. Ask clarifying questions or identify missing info. Respond in raw markdown with no wrapper code blocks. Sign off as AI assistant."

          # Execute direct API call to the server
          RESPONSE=$(curl -s -X POST "https://azure.com" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg sys "$SYSTEM_PROMPT" \
              --arg user "$PROMPT_TEXT" \
              '{
                model: "gpt-4o-mini",
                messages: [
                  {role: "system", content: $sys},
                  {role: "user", content: $user}
                ],
                max_tokens: 1000,
                temperature: 0.5
              }')")

          # Safely read response content
          ANALYSIS=$(echo "$RESPONSE" | jq -r '.choices.message.content // empty')
          
          if [ -z "$ANALYSIS" ] || [ "$ANALYSIS" = "null" ]; then
            ANALYSIS="⚠️ **AI Assistant Warning:** Could not automatically process this issue."
          fi

          # Standard multiline output tracking
          echo "analysis_result<<EOF" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment results on the issue
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: ${{ steps.ai-response.outputs.analysis_result }}
